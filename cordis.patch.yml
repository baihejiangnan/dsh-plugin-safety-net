# dsh-plugin-safety-net keeps each upstream plugin in its own service scope.
# Their browser panels are discovered from their own dsh.client manifests.
- insert:
    - id: safety-net-guard
      name: 'dsh-plugin-safety-net/node_modules/dsh-plugin-guard/src/index.js'
    - id: safety-net-manager
      name: 'dsh-plugin-safety-net/node_modules/dsh-web-plugin-manager/dist/index.js'
      config:
        profile: 'web'
    - id: safety-net-healthcheck
      name: 'dsh-plugin-safety-net/node_modules/dsh-plugin-healthcheck/lib/index.js'

# The manager supplies a writable inventory in the same settings surface.
- id: ui-settings-plugin-inventory
  disabled: true
